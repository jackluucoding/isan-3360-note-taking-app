<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>My Notes</h1>

  <!-- Submitting this form sends a new note to the server -->
  <form id="note-form">
    <label for="note-text">New note</label>
    <input type="text" id="note-text">
    <button>Add</button>
  </form>

  <!-- JavaScript fills this list with the notes from the server -->
  <ul id="note-list"></ul>

  <script src="script.js"></script>
</body>
</html>
